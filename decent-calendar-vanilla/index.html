<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DecentCalendar</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/calendar.css" />
</head>
<body>

  <!-- Web Component Header: <ipfs-status> | <app-title> | <wallet-connect> -->
  <app-header></app-header>

  <!-- IPFS Waiting Modal (Web Component) -->
  <waiting-modal id="ipfs-waiting-modal"></waiting-modal>

  <!-- Main Calendar Web Component (light DOM — FullCalendar needs real DOM) -->
  <decent-calendar></decent-calendar>

  <!-- Footer -->
  <footer class="App-footer">
    <img src="assets/DecentSmartHome_Logo.png" alt="DecentSmartHome" class="icon-small" />
    <img src="assets/Ommm_Token_Logo.png" alt="Ommm Token" class="icon-small" />
    <p>Another creation by A Decent Agency to help the world be on the same page.</p>
    <img src="assets/Ommm_Token_Logo.png" alt="Ommm Token" class="icon-small" />
    <img src="assets/DecentSmartHome_Logo.png" alt="DecentSmartHome" class="icon-small" />
  </footer>

  <!-- Add Event Modal -->
  <div id="add-event-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Add New Event</h3>
      <label>
        Event Title:
        <input type="text" id="event-title" name="title" placeholder="e.g. IT Consultation" />
      </label>
      <label>
        Start Time:
        <input type="datetime-local" id="event-start" name="start" />
      </label>
      <label>
        End Time:
        <input type="datetime-local" id="event-end" name="end" />
      </label>
      <label>
        Hourly Rate (POL):
        <input type="number" id="event-rate" name="hourlyRate" step="0.001" min="0" placeholder="0.05" />
      </label>
      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="event-public" name="isPublic" checked />
          Public Event
        </label>
        <label>
          <input type="checkbox" id="event-private" name="isPrivate" />
          Private Event
        </label>
      </div>
      <button id="save-event-btn">Add Event</button>
      <button id="cancel-event-btn">Cancel</button>
    </div>
  </div>

  <!-- Mint Timeslot Modal -->
  <div id="mint-modal" class="modal hidden">
    <div class="modal-content">
      <h3>⛏️ Mint Timeslot NFT</h3>
      <p class="modal-info">Minting puts this timeslot on-chain and uploads metadata to IPFS.</p>
      <label>
        Title:
        <input type="text" id="mint-title" placeholder="e.g. IT Consultation" />
      </label>
      <label>
        Date:
        <input type="date" id="mint-date" />
      </label>
      <label>
        Start Time:
        <input type="time" id="mint-start" />
      </label>
      <label>
        End Time:
        <input type="time" id="mint-end" />
      </label>
      <label>
        Hourly Rate (POL):
        <input type="number" id="mint-rate" step="0.001" min="0" placeholder="0.05" />
      </label>
      <label>
        Description:
        <input type="text" id="mint-description" placeholder="What will you offer?" />
      </label>
      <button id="confirm-mint-btn">Mint to Chain</button>
      <button id="cancel-mint-btn">Cancel</button>
    </div>
  </div>

  <!-- Booking Modal (buyer view) -->
  <div id="booking-modal" class="modal hidden">
    <div class="modal-content">
      <h3>📅 Book This Timeslot</h3>
      <div id="booking-details"></div>
      <div class="payment-options">
        <button id="pay-crypto-btn">💎 Pay with POL/ETH</button>
        <button id="pay-paypal-btn">🅿️ Pay with PayPal</button>
        <button id="pay-card-btn">💳 Pay with Card</button>
      </div>
      <button id="cancel-booking-btn">Cancel</button>
    </div>
  </div>

  <!-- Meeting Room Modal -->
  <div id="meeting-modal" class="modal hidden">
    <div class="modal-content">
      <h3>🎥 Meeting Room</h3>
      <video id="meeting-video" autoplay playsinline style="width:100%;border-radius:8px;"></video>
      <div id="meeting-controls"></div>
      <button id="close-meeting-btn">Close</button>
    </div>
  </div>

  <!-- Confirm Appointment Modal (owner confirms booking) -->
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-content">
      <h3>✅ Confirm Appointment</h3>
      <div id="confirm-details"></div>
      <button id="confirm-appointment-btn">Confirm &amp; Release Funds</button>
      <button id="cancel-appointment-btn">Cancel Booking (Refund)</button>
    </div>
  </div>

  <!-- CDN Dependencies loaded with crossorigin for security.
       For production, add integrity="sha384-<hash>" to each script tag.
       Generate the hash: curl -s <URL> | openssl dgst -sha384 -binary | openssl base64 -A
  -->
  <script
    src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"
    crossorigin="anonymous"></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"
    crossorigin="anonymous"></script>
  <script
    src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"
    crossorigin="anonymous"></script>

  <!-- App Config (loaded before helpers so DECENT_CONFIG is available) -->
  <script src="decent.config.js"></script>

  <!-- Helper Scripts as globals (order matters — functions used across files) -->
  <script src="js/contract.js"></script>
  <script src="js/events.js"></script>
  <script src="js/payments.js"></script>
  <script src="js/meetingRoom.js"></script>
  <script src="js/calendar.js"></script>

  <!-- Web Components entry point (ES module — deferred automatically) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
